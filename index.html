<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrador - Formulador de Helados</title>
    
    <!-- Configuración para PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; text-align: center; }
        .section { display: none; }
        .section.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; margin-bottom: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 13px; }
        th { background-color: #3498db; color: white; }
        
        .cat-header { background-color: #2c3e50 !important; color: white; text-align: left; padding: 12px 15px; font-weight: bold; cursor: pointer; user-select: none; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; margin-top: 10px; }
        .cat-header:hover { background-color: #34495e !important; }
        .cat-content { display: none; }
        .cat-content.open { display: table-row-group; }

        input[type="number"], input[type="text"], select.select-input { width: 75px; padding: 4px; text-align: center; border: 1px solid #ccc; border-radius: 4px; }
        .results { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 25px; }
        .card { background: #ecf0f1; padding: 12px; border-radius: 6px; text-align: center; border-left: 5px solid #2980b9; }
        .btn { background: #27ae60; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-primary { background: #2980b9; color: white; border: none; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; background: #2c3e50; padding: 10px 20px; border-radius: 6px; margin-bottom: 20px; color: white; }
        .footer-total-row { background-color: #eaeded; font-weight: bold; }
        .panel-recetas { background: #f8f9fa; border: 1px solid #e9ecef; padding: 15px; border-radius: 6px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        #loading-indicator { text-align: center; padding: 10px; background: #fef9e7; color: #d68910; font-weight: bold; border-radius: 4px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-bar">
        <span>🍦 <strong>Formulador de Obrador</strong></span>
        <div class="menu-buttons">
            <button class="btn btn-primary" onclick="cambiarVista('balance')">Fórmula Activa</button>
            <button class="btn btn-primary" onclick="cambiarVista('multiplicador')">Multiplicador</button>
            <button class="btn btn-primary" onclick="cambiarVista('ingredientes')">Base de Datos</button>
        </div>
    </div>

    <div id="loading-indicator">🔄 Sincronizando ingredientes...</div>

    <!-- VISTA 1: FORMULA ACTIVA -->
    <div id="vista-balance" class="section active">
        <h1>Fórmula Activa</h1>
        
        <!-- Panel para guardar receta en Google Sheets -->
        <div class="panel-recetas">
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <input type="text" id="input-nombre-guardar" placeholder="Nombre de tu receta..." style="width: 200px;">
                <button class="btn" onclick="guardarRecetaEnNube()">💾 Guardar Receta en Nube</button>
            </div>
            <div>
                <span>Peso Total: <strong id="res-peso">0 g</strong></span>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Ingrediente</th>
                    <th>Cantidad (g)</th>
                    <th>% Graso</th>
                    <th>Sólidos Totales</th>
                    <th>P.O.D.</th>
                    <th>P.A.C.</th>
                    <th>Lactosa</th>
                    <th>Proteína</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tabla-receta-body"></tbody>
            <tfoot>
                <tr class="footer-total-row" id="fila-totales"></tr>
            </tfoot>
        </table>

        <div style="text-align: center; margin: 20px 0;">
            <select id="select-nuevo-ing" style="padding: 8px; width: 300px;"></select>
            <button class="btn" onclick="agregarAIngredientesReceta()">+ Agregar a la Receta</button>
        </div>
    </div>

    <!-- VISTA 2: MULTIPLICADOR -->
    <div id="vista-multiplicador" class="section">
        <h1>Multiplicador</h1>
        <div style="text-align: center; margin-bottom: 15px;">
            <label>Multiplicar por: </label>
            <input type="number" id="input-multiplicador" value="1" step="0.1" oninput="renderMultiplicador()" style="width: 80px;">
        </div>
        <table>
            <thead>
                <tr>
                    <th>Ingrediente</th>
                    <th>Base (g)</th>
                    <th>Producción Total</th>
                </tr>
            </thead>
            <tbody id="tabla-multiplicador-body"></tbody>
            <tfoot>
                <tr class="footer-total-row" id="fila-totales-multiplicador"></tr>
            </tfoot>
        </table>
    </div>

    <!-- VISTA 3: BASE DE DATOS -->
    <div id="vista-ingredientes" class="section">
        <h1>Base de Datos (Google Sheets)</h1>
        <div id="contenedor-categorias-db"></div>
    </div>
</div>

<script>
    const URL_GOOGLE_SHEET = "https://script.google.com/macros/s/AKfycbyu6i8IpoFL1QXUQ-IpDlkFDh3Kfv13qpvWgN0On72hT7CdAByJJugdd3ObiUiPxTgN/exec";

    let baseDatos = [];
    let receta = [
        { nombre: "Leche", gramos: 605 },
        { nombre: "Crema/Nata 35% GRASA", gramos: 120 }
    ];

    let vistaActual = 'balance';

    async function cargarBaseDatosDesdeNube() {
        const indicator = document.getElementById('loading-indicator');
        indicator.style.display = 'block';
        try {
            const response = await fetch(URL_GOOGLE_SHEET);
            const data = await response.json();
            
            baseDatos = data.map((item, index) => ({
                id: index + 1,
                categoria: item.CATEGORIA || "General",
                nombre: item.NOMBRE || "Sin nombre",
                graso: parseFloat(item.GRASO) || 0,
                st: parseFloat(item.ST) || 0,
                pod: parseFloat(item.POD) || 0,
                pac: parseFloat(item.PAC) || 0,
                lactosa: parseFloat(item.LACTOSA) || 0,
                proteina: parseFloat(item.PROTEINA) || 0
            }));

            indicator.style.display = 'none';
            renderBaseDatos();
            renderReceta();
        } catch (e) {
            console.error("Error al cargar la base de datos:", e);
            indicator.innerText = "⚠️ Error al conectar con Google Sheets.";
            indicator.style.background = "#fadbd8";
            indicator.style.color = "#c0392b";
        }
    }

    function cambiarVista(vista) {
        vistaActual = vista;
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('vista-' + vista).classList.add('active');
        if(vista === 'multiplicador') renderMultiplicador();
    }

    function renderBaseDatos() {
        const contenedor = document.getElementById('contenedor-categorias-db');
        contenedor.innerHTML = '';
        let cats = [...new Set(baseDatos.map(i => i.categoria))];

        cats.forEach((cat, index) => {
            const itemsCat = baseDatos.filter(i => i.categoria === cat);
            let htmlCat = `
                <div class="cat-header" onclick="toggleAcordeon('cat-body-${index}', 'icon-${index}')">
                    <span>📂 ${cat} (${itemsCat.length})</span>
                    <span id="icon-${index}">▼</span>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Ingrediente</th>
                            <th>% Graso</th>
                            <th>ST</th>
                            <th>POD</th>
                            <th>PAC</th>
                        </tr>
                    </thead>
                    <tbody id="cat-body-${index}" class="cat-content">
            `;
            itemsCat.forEach(ing => {
                htmlCat += `
                    <tr>
                        <td><strong>${ing.nombre}</strong></td>
                        <td>${ing.graso}</td>
                        <td>${ing.st}</td>
                        <td>${ing.pod}</td>
                        <td>${ing.pac}</td>
                    </tr>
                `;
            });
            htmlCat += `</tbody></table>`;
            contenedor.innerHTML += htmlCat;
        });

        actualizarSelectReceta();
    }

    function toggleAcordeon(bodyId, iconId) {
        const tbody = document.getElementById(bodyId);
        const icon = document.getElementById(iconId);
        tbody.classList.toggle('open');
        icon.innerText = tbody.classList.contains('open') ? '▲' : '▼';
    }

    function actualizarSelectReceta() {
        const select = document.getElementById('select-nuevo-ing');
        select.innerHTML = '';
        [...new Set(baseDatos.map(i => i.categoria))].forEach(cat => {
            const items = baseDatos.filter(i => i.categoria === cat);
            if(items.length > 0) {
                const group = document.createElement('optgroup');
                group.label = cat;
                items.forEach(ing => {
                    const opt = document.createElement('option');
                    opt.value = ing.nombre;
                    opt.text = ing.nombre;
                    group.appendChild(opt);
                });
                select.appendChild(group);
            }
        });
    }

    function renderReceta() {
        const tbody = document.getElementById('tabla-receta-body');
        tbody.innerHTML = '';
        let pesoTotal = 0, sumGraso = 0, sumST = 0, sumPOD = 0, sumPAC = 0, sumLactosa = 0, sumProteina = 0;

        receta.forEach((item, index) => {
            const info = baseDatos.find(b => b.nombre === item.nombre);
            if(!info) return;

            const g = item.gramos;
            pesoTotal += g;
            sumGraso += g * (info.graso / 100);
            sumST += g * (info.st / 100);
            sumPOD += g * (info.pod / 100);
            sumPAC += g * (info.pac / 100);
            sumLactosa += g * (info.lactosa / 100);
            sumProteina += g * (info.proteina / 100);

            tbody.innerHTML += `
                <tr>
                    <td><strong>${info.nombre}</strong></td>
                    <td><input type="number" value="${g}" onchange="cambiarGramos(${index}, this.value)"></td>
                    <td>${(g * (info.graso / 100)).toFixed(2)}</td>
                    <td>${(g * (info.st / 100)).toFixed(2)}</td>
                    <td>${(g * (info.pod / 100)).toFixed(2)}</td>
                    <td>${(g * (info.pac / 100)).toFixed(2)}</td>
                    <td>${(g * (info.lactosa / 100)).toFixed(2)}</td>
                    <td>${(g * (info.proteina / 100)).toFixed(2)}</td>
                    <td><button class="btn" style="background:#e74c3c;" onclick="eliminarIngrediente(${index})">X</button></td>
                </tr>
            `;
        });

        document.getElementById('fila-totales').innerHTML = `
            <td>TOTAL</td>
            <td>${pesoTotal.toFixed(0)}</td>
            <td>${sumGraso.toFixed(2)}</td>
            <td>${sumST.toFixed(2)}</td>
            <td>${sumPOD.toFixed(2)}</td>
            <td>${sumPAC.toFixed(2)}</td>
            <td>${sumLactosa.toFixed(2)}</td>
            <td>${sumProteina.toFixed(2)}</td>
            <td>-</td>
        `;

        document.getElementById('res-peso').innerText = `${pesoTotal.toFixed(0)} g`;
    }

    function cambiarGramos(index, val) {
        receta[index].gramos = parseFloat(val) || 0;
        renderReceta();
    }

    function eliminarIngrediente(index) {
        receta.splice(index, 1);
        renderReceta();
    }

    function agregarAIngredientesReceta() {
        const nombreIng = document.getElementById('select-nuevo-ing').value;
        if(!nombreIng) return;
        const existe = receta.find(r => r.nombre === nombreIng);
        if(existe) existe.gramos += 100;
        else receta.push({ nombre: nombreIng, gramos: 100 });
        renderReceta();
    }

    function renderMultiplicador() {
        const mult = parseFloat(document.getElementById('input-multiplicador').value) || 1;
        const tbody = document.getElementById('tabla-multiplicador-body');
        tbody.innerHTML = '';
        let totalBase = 0, totalProd = 0;

        receta.forEach(item => {
            const base = item.gramos;
            const prod = base * mult;
            totalBase += base;
            totalProd += prod;

            tbody.innerHTML += `
                <tr>
                    <td><strong>${item.nombre}</strong></td>
                    <td>${base} g</td>
                    <td style="background: #fcf3cf; font-weight: bold;">${prod.toFixed(1)} g</td>
                </tr>
            `;
        });

        document.getElementById('fila-totales-multiplicador').innerHTML = `
            <td>TOTAL</td>
            <td>${totalBase} g</td>
            <td style="color: #27ae60;">${totalProd.toFixed(1)} g</td>
        `;
    }

    async function guardarRecetaEnNube() {
        let nombre = document.getElementById('input-nombre-guardar').value.trim();
        if (!nombre) {
            nombre = prompt("Ingresa un nombre para tu receta:");
            if (!nombre) return;
        }

        let pesoTotal = receta.reduce((acc, item) => acc + item.gramos, 0);

        let payload = {
            action: 'guardarReceta',
            nombre: nombre,
            pesoTotal: pesoTotal,
            graso: 0, st: 0, pod: 0, pac: 0, lactosa: 0, proteina: 0,
            ingredientes: receta
        };

        alert("Guardando receta en Google Sheets...");

        try {
            await fetch(URL_GOOGLE_SHEET, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            alert("✅ ¡Receta enviada a Google Sheets con éxito!");
            document.getElementById('input-nombre-guardar').value = '';
        } catch (e) {
            console.error(e);
            alert("❌ Hubo un error al intentar guardar.");
        }
    }

    cargarBaseDatosDesdeNube();
</script>
</body>
</html>
