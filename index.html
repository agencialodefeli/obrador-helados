<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrador - Formulador de Helados</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; text-align: center; }
        .section { display: none; }
        .section.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; margin-bottom: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 13px; }
        th { background-color: #3498db; color: white; }
        input[type="number"], input[type="text"], select.select-input { width: 75px; padding: 4px; text-align: center; border: 1px solid #ccc; border-radius: 4px; }
        .results { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 25px; }
        .card { background: #ecf0f1; padding: 12px; border-radius: 6px; text-align: center; border-left: 5px solid #2980b9; }
        .btn { background: #27ae60; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-danger { background: #e74c3c; }
        .btn-warning { background: #f39c12; }
        .btn-primary { background: #2980b9; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; background: #2c3e50; padding: 10px 20px; border-radius: 6px; margin-bottom: 20px; color: white; }
        .panel-recetas { background: #f8f9fa; border: 1px solid #e9ecef; padding: 15px; border-radius: 6px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        #loading-indicator { text-align: center; padding: 10px; background: #fef9e7; color: #d68910; font-weight: bold; border-radius: 4px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-bar">
        <span>🍦 <strong>Formulador de Obrador</strong></span>
        <div class="menu-buttons">
            <button onclick="cambiarVista('balance')">Fórmula Activa</button>
            <button onclick="cambiarVista('multiplicador')">Multiplicador</button>
            <button onclick="cambiarVista('ingredientes')">BD</button>
        </div>
    </div>

    <div id="loading-indicator">🔄 Sincronizando...</div>

    <!-- VISTA 1: FORMULA ACTIVA -->
    <div id="vista-balance" class="section active">
        <h1>Fórmula Activa</h1>
        <div class="panel-recetas">
            <input type="text" id="input-nombre-guardar" placeholder="Nombre receta..." style="width: 180px;">
            <button class="btn" onclick="guardarRecetaSegura()">💾 Guardar en Nube</button>
            <button class="btn btn-danger" onclick="eliminarRecetaSegura()">🗑️ Eliminar</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Ingrediente</th>
                    <th>Cantidad (g)</th>
                    <th>% Graso</th>
                    <th>ST</th>
                    <th>P.O.D.</th>
                    <th>P.A.C.</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tabla-receta-body"></tbody>
            <tfoot><tr class="footer-total-row" id="fila-totales"></tr></tfoot>
        </table>

        <div style="text-align: center; margin: 20px 0;">
            <select id="select-nuevo-ing" style="padding: 8px; width: 300px;"></select>
            <button class="btn" onclick="agregarAIngredientesReceta()">+ Agregar Ingrediente</button>
        </div>
    </div>

    <!-- OTRAS VISTAS (Multiplicador e Ingredientes) -->
    <div id="vista-multiplicador" class="section">
        <h2>Multiplicador</h2>
    </div>
    <div id="vista-ingredientes" class="section">
        <h2>Base de Datos</h2>
    </div>
</div>

<script>
    const URL_GOOGLE_SHEET = "https://script.google.com/macros/s/AKfycbyu6i8IpoFL1QXUQ-IpDlkFDh3Kfv13qpvWgN0On72hT7CdAByJJugdd3ObiUiPxTgN/exec";
    const PASSWORD_OBRADOR = "1418"; 
    let baseDatos = [];
    let receta = [{ nombre: "Leche", gramos: 605 }, { nombre: "Crema/Nata 35% GRASA", gramos: 120 }];

    // --- SEGURIDAD ---
    function verificarPassword() {
        return prompt("🔐 Ingresa el código de seguridad:") === PASSWORD_OBRADOR;
    }

    // --- GESTIÓN DE VISTAS ---
    function cambiarVista(vista) {
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
        if (vista === 'balance') document.getElementById('vista-balance').classList.add('active');
        if (vista === 'multiplicador') document.getElementById('vista-multiplicador').classList.add('active');
        if (vista === 'ingredientes') document.getElementById('vista-ingredientes').classList.add('active');
    }

    // --- FUNCIONES DE EDICIÓN (LIBRES, SIN CONTRASEÑA) ---
    function cambiarGramosReceta(index, val) {
        receta[index].gramos = parseFloat(val) || 0;
        renderReceta();
    }

    function eliminarDeReceta(index) {
        receta.splice(index, 1);
        renderReceta();
    }

    function agregarAIngredientesReceta() {
        const select = document.getElementById('select-nuevo-ing');
        const nombreIng = select ? select.value : "Ingrediente";
        receta.push({ nombre: nombreIng, gramos: 100 });
        renderReceta();
    }

    // --- FUNCIONES PROTEGIDAS (SOLO AQUÍ SE PIDE CONTRASEÑA) ---
    async function guardarRecetaSegura() {
        if (!verificarPassword()) return alert("Acceso denegado");
        alert("Guardando en la nube...");
        // Tu lógica de fetch con Google Sheets
    }

    function eliminarRecetaSegura() {
        if (!verificarPassword()) return;
        alert("Receta eliminada");
    }

    // --- RENDER ---
    function renderReceta() {
        const tbody = document.getElementById('tabla-receta-body');
        if (!tbody) return;
        tbody.innerHTML = '';
        receta.forEach((item, index) => {
            tbody.innerHTML += `
                <tr>
                    <td>${item.nombre}</td>
                    <td><input type="number" value="${item.gramos}" onchange="cambiarGramosReceta(${index}, this.value)"></td>
                    <td>-</td><td>-</td><td>-</td><td>-</td>
                    <td><button class="btn btn-danger" onclick="eliminarDeReceta(${index})">X</button></td>
                </tr>`;
        });
    }

    // Inicialización
    document.addEventListener("DOMContentLoaded", () => {
        const indicator = document.getElementById('loading-indicator');
        if(indicator) indicator.style.display = 'none';
        renderReceta();
    });
</script>
</body>
</html>
