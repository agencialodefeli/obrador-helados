<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Obrador - Formulador de Helados</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; }
        .panel { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .btn { padding: 10px 15px; cursor: pointer; border-radius: 4px; border: none; color: white; font-weight: bold; }
        .btn-guardar { background: #27ae60; }
        .btn-cargar { background: #2980b9; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        .controls { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
    </style>
</head>
<body>

<div class="panel">
    <h1>Formulador de Helados</h1>
    <div class="controls">
        <input type="text" id="nombre-receta" placeholder="Nombre receta">
        <button class="btn btn-guardar" onclick="guardarReceta()">💾 Guardar Receta</button>
    </div>
    <div class="controls">
        <select id="select-recetas"><option value="">-- Cargar Receta --</option></select>
        <button class="btn btn-cargar" onclick="cargarReceta()">📂 CARGAR RECETA</button>
    </div>
</div>

<div class="panel">
    <table>
        <thead><tr><th>Ingrediente</th><th>Gramos</th><th>Acción</th></tr></thead>
        <tbody id="tabla-body"></tbody>
    </table>
    <div style="margin-top: 15px;">
        <select id="select-ingredientes"></select>
        <button onclick="agregarIngrediente()">+ Agregar Ingrediente</button>
    </div>
</div>

<script>
    const URL_GS = "https://script.google.com/macros/s/AKfycbyu6i8IpoFL1QXUQ-IpDlkFDh3Kfv13qpvWgN0On72hT7CdAByJJugdd3ObiUiPxTgN/exec";
    let baseDatos = [];
    let listaRecetas = { cabecera: [], detalle: [] };
    let recetaActual = [];

    async function init() {
        // Cargar Ingredientes
        const resIng = await fetch(URL_GS);
        baseDatos = await resIng.json();
        
        // Cargar Recetas
        const resRec = await fetch(URL_GS + "?action=cargarRecetas");
        listaRecetas = await resRec.json();
        
        // Llenar selects
        const selIng = document.getElementById('select-ingredientes');
        baseDatos.forEach(i => selIng.innerHTML += `<option value="${i.NOMBRE}">${i.NOMBRE}</option>`);
        
        const selRec = document.getElementById('select-recetas');
        listaRecetas.cabecera.forEach(row => selRec.innerHTML += `<option value="${row[0]}">${row[1]}</option>`);
    }

    function renderTabla() {
        const tbody = document.getElementById('tabla-body');
        tbody.innerHTML = '';
        recetaActual.forEach((item, index) => {
            tbody.innerHTML += `<tr><td>${item.nombre}</td><td>${item.gramos}</td><td><button onclick="eliminar(${index})">Eliminar</button></td></tr>`;
        });
    }

    function agregarIngrediente() {
        const nombre = document.getElementById('select-ingredientes').value;
        recetaActual.push({ nombre: nombre, gramos: 100 });
        renderTabla();
    }

    function eliminar(index) {
        recetaActual.splice(index, 1);
        renderTabla();
    }

    async function guardarReceta() {
        const nombre = document.getElementById('nombre-receta').value;
        const payload = { action: 'guardarReceta', nombre: nombre, ingredientes: recetaActual };
        await fetch(URL_GS, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
        alert("Receta guardada exitosamente");
    }

    function cargarReceta() {
        const id = document.getElementById('select-recetas').value;
        if (!id) return;
        const detalles = listaRecetas.detalle.filter(row => String(row[0]) === String(id));
        recetaActual = detalles.map(row => ({ nombre: row[1], gramos: row[2] }));
        renderTabla();
    }

    init();
</script>
</body>
</html>
